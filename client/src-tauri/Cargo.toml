[package]
name = "aetherstream-desktop"
version = "1.2.0"
description = "AetherStream Desktop Client Shell"
authors = ["AetherStream Core Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.5", features = ["http-all"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
